        <script>
function loadTab(tab, page = 1, search = '') {
    $.get("https://pemdigi.bekasikab.go.id/katalog-layanan-data", { tab, page, search }, function(res) {

        let staticCard = '';

        // Hanya tampil di tab layanan-publik
        if (tab === 'layanan-publik') {
            staticCard = `
                <div class="col-md-4 mb-3">
                    <a href="https://banpin.bekasikab.go.id"
                       target="_blank"
                       class="text-decoration-none">
                        <div class="card h-100 shadow-sm">
                            <div class="card-body">
                                <h5 class="card-title">Banpin</h5>
                                <p class="card-text">
                                    Berfungsi sebagai sistem informasi pemberian Bantuan Pendidikan bagi Pemuda Pemudi Berprestasi di Kabupaten Bekasi
                                </p>
                            </div>
                        </div>
                    </a>
                </div>
            `;
        }

        $("#" + tab).html(staticCard + res);
    });
}

$(document).ready(function() {
    // load default tab
    loadTab('layanan-publik');

    // tab click
    $('#myTab button').on('click', function() {
        let tab = $(this).data('bs-target').substring(1);
        loadTab(tab);
    });

    // search
    $("#search").on("keyup", function() {
        let tab = $(".nav-link.active").data('bs-target').substring(1);
        loadTab(tab, 1, $(this).val());
    });

    // handle pagination
    $(document).on('click', '.pagination a', function(e) {
        e.preventDefault();
        let url = new URL($(this).attr('href'));
        let page = url.searchParams.get('page');
        let tab = $(".nav-link.active").data('bs-target').substring(1);
        let search = $("#search").val();
        loadTab(tab, page, search);
    });
});

// Card dari database tetap membuka modal
$(document).on("click", ".card-katalog", function() {
    let url = $(this).data("url");

    $.get(url, function(res) {
        $("#modalDetail .modal-body").html(res);
        $("#modalDetail").modal("show");
    });
});
</script>
